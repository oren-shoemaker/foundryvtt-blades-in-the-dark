<div id="loadout" class="flex-vertical">

		<div class="label-stripe">

           <p>{{localize "UTCF.Factions"}}</p>
          <p><a class="item-add-popup" data-item-type="faction"><i class="fas fa-plus-square"></i></a></p>
        </div>
        <div>
          {{#each items as |faction id|}}
          {{#if (eq faction.type "faction")}}
            <div class="item flex-horizontal-spaced" data-item-id="{{faction._id}}">
              <div class="item-body flex-horizontal-spaced">
                <img src="{{faction.img}}" title="{{faction.name}}" width="24" height="24"/>
                <div class="item-name">{{faction.name}}</div>
                <div class="item-description">{{faction.system.description}}</div>
              </div>
              <a class="item-control item-delete" title="{{localize 'UTCF.TitleDeleteItem'}}"><i class="fas fa-trash"></i></a>
              <a class="item-control item-post" title="{{localize 'UTCF.TitlePostItem'}}"><i class="fas fa-comment"></i></a>
            </div>
          {{/if}}
          {{/each}}
          <div class="item-class-label"><a class="item-add-popup" data-item-type="faction">{{localize "UTCF.AddItem"}}</a></div>
        </div>

</div>
